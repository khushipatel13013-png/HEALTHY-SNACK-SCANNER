<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Analyzer AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: #e0e0e0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }

        h1 {
            font-size: 2.4rem;
            font-weight: 700;
            background: linear-gradient(90deg, #f7971e, #ffd200);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #9a97b0;
            font-size: 1rem;
            margin-bottom: 36px;
        }

        /* --- Glass Card --- */
        .card {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 36px;
            width: 100%;
            max-width: 560px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        /* --- Upload Area --- */
        .upload-area {
            border: 2px dashed rgba(255, 255, 255, 0.2);
            border-radius: 16px;
            padding: 40px 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }

        .upload-area:hover,
        .upload-area.dragover {
            border-color: #ffd200;
            background: rgba(255, 210, 0, 0.05);
        }

        .upload-area .icon {
            font-size: 3rem;
            margin-bottom: 12px;
        }

        .upload-area p {
            color: #9a97b0;
            font-size: 0.95rem;
        }

        .upload-area p span {
            color: #ffd200;
            font-weight: 600;
        }

        #fileInput {
            display: none;
        }

        /* --- Image Preview --- */
        .preview-container {
            margin-top: 20px;
            display: none;
        }

        .preview-container img {
            max-width: 100%;
            max-height: 240px;
            border-radius: 12px;
            border: 2px solid rgba(255, 255, 255, 0.1);
        }

        .file-name {
            margin-top: 8px;
            font-size: 0.85rem;
            color: #9a97b0;
        }

        /* --- Button --- */
        .btn {
            margin-top: 24px;
            padding: 14px 40px;
            font-size: 1rem;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            background: linear-gradient(135deg, #f7971e, #ffd200);
            color: #1a1a2e;
            transition: all 0.3s ease;
            width: 100%;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 210, 0, 0.3);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* --- Loader --- */
        .loader {
            display: none;
            margin: 24px auto 0;
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top-color: #ffd200;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .loader-text {
            display: none;
            margin-top: 12px;
            color: #9a97b0;
            font-size: 0.9rem;
        }

        /* --- Results Table --- */
        .results {
            margin-top: 36px;
            width: 100%;
            max-width: 900px;
            display: none;
        }

        .results h2 {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 16px;
            color: #ffd200;
        }

        .table-wrapper {
            overflow-x: auto;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }

        thead {
            background: rgba(255, 210, 0, 0.12);
        }

        th {
            padding: 14px 16px;
            text-align: left;
            font-weight: 600;
            color: #ffd200;
            white-space: nowrap;
        }

        td {
            padding: 12px 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
        }

        tbody tr {
            transition: background 0.2s;
        }

        tbody tr:hover {
            background: rgba(255, 255, 255, 0.04);
        }

        /* Health Rating Badges */
        .badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .badge-healthy {
            background: rgba(46, 213, 115, 0.15);
            color: #2ed573;
        }

        .badge-moderate {
            background: rgba(255, 165, 2, 0.15);
            color: #ffa502;
        }

        .badge-unhealthy {
            background: rgba(255, 71, 87, 0.15);
            color: #ff4757;
        }

        /* --- Model Used Label --- */
        .model-used {
            font-size: 0.85rem;
            color: #9a97b0;
            margin-bottom: 14px;
        }

        .model-used span {
            color: #ffd200;
            font-weight: 600;
        }

        /* --- Error --- */
        .error-msg {
            display: none;
            margin-top: 20px;
            padding: 14px;
            border-radius: 12px;
            background: rgba(255, 71, 87, 0.1);
            border: 1px solid rgba(255, 71, 87, 0.3);
            color: #ff6b81;
            font-size: 0.9rem;
        }

        /* --- Responsive --- */
        @media (max-width: 600px) {
            h1 {
                font-size: 1.7rem;
            }

            .card {
                padding: 24px;
            }

            th,
            td {
                padding: 10px 12px;
                font-size: 0.82rem;
            }
        }
    </style>
</head>

<body>

    <h1>🍕Ai Based Food Analyzer</h1>
    <p class="subtitle">Upload a food image &amp; get instant nutritional insights</p>

    <!-- Upload Card -->
    <div class="card">
        <div class="upload-area" id="uploadArea">
            <div class="icon">📸</div>
            <p>Drag &amp; drop your food image here<br>or <span>click to browse</span></p>
            <input type="file" id="fileInput" accept="image/*">
        </div>

        <div class="preview-container" id="previewContainer">
            <img id="previewImage" src="" alt="Preview">
            <p class="file-name" id="fileName"></p>
        </div>

        <button class="btn" id="analyzeBtn" disabled>🔍 Analyze Food</button>
        <div class="loader" id="loader"></div>
        <p class="loader-text" id="loaderText">Analyzing your food with AI...</p>
        <div class="error-msg" id="errorMsg"></div>
    </div>

    <!-- Results -->
    <div class="results" id="results">
        <h2>📊 Nutritional Analysis</h2>
        <p class="model-used" id="modelUsed"></p>
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Food Item</th>
                        <th>Calories</th>
                        <th>Protein</th>
                        <th>Carbs</th>
                        <th>Fat</th>
                        <th>Fiber</th>
                        <th>Sugar</th>
                        <th>Rating</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </div>

    <script>
        const uploadArea = document.getElementById("uploadArea");
        const fileInput = document.getElementById("fileInput");
        const previewContainer = document.getElementById("previewContainer");
        const previewImage = document.getElementById("previewImage");
        const fileName = document.getElementById("fileName");
        const analyzeBtn = document.getElementById("analyzeBtn");
        const loader = document.getElementById("loader");
        const loaderText = document.getElementById("loaderText");
        const errorMsg = document.getElementById("errorMsg");
        const results = document.getElementById("results");
        const tableBody = document.getElementById("tableBody");
        const modelUsed = document.getElementById("modelUsed");

        let selectedFile = null;

        // --- Upload Area Events ---
        uploadArea.addEventListener("click", () => fileInput.click());

        uploadArea.addEventListener("dragover", (e) => {
            e.preventDefault();
            uploadArea.classList.add("dragover");
        });

        uploadArea.addEventListener("dragleave", () => {
            uploadArea.classList.remove("dragover");
        });

        uploadArea.addEventListener("drop", (e) => {
            e.preventDefault();
            uploadArea.classList.remove("dragover");
            if (e.dataTransfer.files.length) {
                fileInput.files = e.dataTransfer.files;
                handleFile(e.dataTransfer.files[0]);
            }
        });

        fileInput.addEventListener("change", () => {
            if (fileInput.files.length) handleFile(fileInput.files[0]);
        });

        function handleFile(file) {
            selectedFile = file;
            fileName.textContent = file.name;
            const reader = new FileReader();
            reader.onload = (e) => {
                previewImage.src = e.target.result;
                previewContainer.style.display = "block";
            };
            reader.readAsDataURL(file);
            analyzeBtn.disabled = false;
            errorMsg.style.display = "none";
            results.style.display = "none";
        }

        // --- Analyze Button ---
        analyzeBtn.addEventListener("click", async () => {
            if (!selectedFile) return;

            // Show loader
            analyzeBtn.disabled = true;
            loader.style.display = "block";
            loaderText.style.display = "block";
            errorMsg.style.display = "none";
            results.style.display = "none";

            const formData = new FormData();
            formData.append("image", selectedFile);

            try {
                const res = await fetch("/analyze", { method: "POST", body: formData });
                const data = await res.json();

                if (data.error) {
                    showError(data.error);
                    return;
                }

                // Show which model was used
                modelUsed.innerHTML = data.model_used
                    ? `Powered by <span>${data.model_used}</span>`
                    : "";

                // Build table rows
                tableBody.innerHTML = "";
                data.results.forEach((item) => {
                    const ratingClass = getRatingClass(item["Health Rating"]);
                    const row = `
                        <tr>
                            <td><strong>${item["Food Item"]}</strong></td>
                            <td>${item["Calories (kcal)"]}</td>
                            <td>${item["Protein (g)"]}g</td>
                            <td>${item["Carbs (g)"]}g</td>
                            <td>${item["Fat (g)"]}g</td>
                            <td>${item["Fiber (g)"]}g</td>
                            <td>${item["Sugar (g)"]}g</td>
                            <td><span class="badge ${ratingClass}">${item["Health Rating"]}</span></td>
                        </tr>`;
                    tableBody.innerHTML += row;
                });

                results.style.display = "block";
                results.scrollIntoView({ behavior: "smooth" });
            } catch (err) {
                showError("Something went wrong. Please try again.");
            } finally {
                loader.style.display = "none";
                loaderText.style.display = "none";
                analyzeBtn.disabled = false;
            }
        });

        function getRatingClass(rating) {
            if (!rating) return "badge-moderate";
            const r = rating.toLowerCase();
            if (r === "healthy") return "badge-healthy";
            if (r === "unhealthy") return "badge-unhealthy";
            return "badge-moderate";
        }

        function showError(msg) {
            errorMsg.textContent = msg;
            errorMsg.style.display = "block";
            loader.style.display = "none";
            loaderText.style.display = "none";
            analyzeBtn.disabled = false;
        }
    </script>

</body>

</html>
